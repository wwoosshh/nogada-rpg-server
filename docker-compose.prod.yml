# 배포용 구성 — 서버 + PostgreSQL. 미니PC 한 대에서 도는 것을 전제한다.
#
#   cp apps/server/.env.example apps/server/.env   # 그리고 비밀번호를 바꾼다
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 개발용 docker-compose.yml 과 **파일이 다르다.** 개발 쪽은 5432 를 호스트에
# 열어 두고 서버는 손으로 띄우지만(테스트가 그 포트를 쓴다), 여기서는 DB 포트를
# 밖으로 내지 않고 서버 컨테이너만 문을 연다 — 열어 둘 이유가 없는 포트를 열지
# 않는 것이 미니PC 를 인터넷에 두는 날의 유일한 방어선이다.
#
# 마이그레이션은 서버 컨테이너의 엔트리포인트가 기동 때마다 돌린다
# (apps/server/docker-entrypoint.sh). 사람이 잊을 수 있는 단계를 남기지 않는다.
#
# 관리 화면(Adminer·Dozzle)은 `--profile admin` 으로 따로 켠다 — 파일 아래쪽에
# 이유와 함께 있고, 절차는 docs/deploy.md 14장이다.
#
# 백업: scripts/backup.sh (pg_dump 한 줄). 자세한 절차는 docs/deploy.md.

name: nogada

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # 계정·비밀번호·DB 이름은 서버가 쓰는 .env 와 **같은 파일**에서 온다.
    # 두 파일로 나누면 언젠가 한쪽만 고치고, 그날 서버는 자기 DB 에 못 붙는다.
    env_file:
      - ./apps/server/.env
    # 네임드 볼륨이다. 컨테이너를 지우고 이미지를 새로 구워도 캐릭터는 남는다.
    # 이 볼륨을 지우는 것(`docker compose down -v`)이 곧 진행도 삭제다.
    volumes:
      - nogada-prod-db:/var/lib/postgresql/data
    healthcheck:
      # $$ 는 compose 가 아니라 컨테이너 셸이 풀 변수라는 뜻이다.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    # 로그를 회전시킨다. 도커의 기본 json-file 드라이버는 **한계가 없어서**
    # 컨테이너가 도는 내내 파일 하나가 계속 자란다 — 몇 달 뒤 미니PC 의 SSD 를
    # 채우는 것은 대개 게임 자료가 아니라 이 파일이고, 디스크가 찬 서버는
    # 로그를 못 써서 죽는다. 50MB(10m × 5)면 최근 며칠은 남는다.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  server:
    build:
      # 문맥이 리포지토리 루트인 이유는 pnpm 워크스페이스이기 때문이다 —
      # 서버는 @nogada/shared·@nogada/data 를 소스로 가져다 쓴다.
      context: .
      dockerfile: apps/server/Dockerfile
      # 배포된 서버가 자기 커밋을 말할 수 있어야 원격에서 배포를 검증한다.
      # 값은 배포 워크플로가 `$env:GIT_SHA` 로 넣어 준다 — 손으로 띄울 때는
      # 비어 있어도 `unknown` 으로 떨어진다(Dockerfile 의 ARG 기본값).
      args:
        GIT_SHA: '${GIT_SHA:-unknown}'
    restart: unless-stopped
    env_file:
      - ./apps/server/.env
    depends_on:
      db:
        # "포트는 열렸는데 아직 초기화 중"인 몇 초에 걸려 넘어지지 않도록
        # 헬스체크가 통과할 때까지 기다린다(설계 규범 9). 이것이 없으면 첫
        # 기동의 마이그레이션이 절반의 확률로 실패한다.
        condition: service_healthy
    # 리버스 프록시(caddy) 뒤에 둘 때는 이 줄을 '127.0.0.1:3000:3000' 으로
    # 바꾼다 — 그러면 3000 은 미니PC 안에서만 보이고 밖에서는 443 만 열린다.
    ports:
      - '3000:3000'
    # 요청 로그가 켜지면서(LOG_LEVEL, 기본 info) 이 컨테이너가 가장 많이 쓴다.
    # db 와 같은 이유로 회전시킨다 — 자세한 것은 위.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # 도메인 + 자동 HTTPS 로 공개할 때만 쓴다:
  #
  #   docker compose -f docker-compose.prod.yml --profile caddy up -d
  #
  # 프로필에 넣어 둔 이유는 이것이 선택이기 때문이다 — LAN 이나 Tailscale 로만
  # 노는 동안에는 80/443 을 열 이유가 없다. 반대로 **LAN 밖에 서버를 내놓는다면
  # TLS 없이는 금지다**(설계 규범 8): 평문으로 나가는 것은 비밀번호와 세션
  # 토큰이고, 그것을 공용 와이파이에 흘리는 순간 계정이 남의 것이 된다.
  caddy:
    image: caddy:2-alpine
    profiles: ['caddy']
    restart: unless-stopped
    env_file:
      - ./apps/server/.env
    depends_on:
      - server
    ports:
      - '80:80'
      - '443:443'
    # Caddyfile 없이 한 줄로 세운다. PUBLIC_DOMAIN 이 진짜 도메인이면 Caddy 가
    # 인증서를 알아서 받아 오고 갱신한다(80 이 열려 있어야 한다).
    command: ['sh', '-c', 'caddy reverse-proxy --from "$$PUBLIC_DOMAIN" --to server:3000']
    volumes:
      # 받아 온 인증서가 여기 산다. 이 볼륨을 지우면 재발급을 받게 되고,
      # 하루에 여러 번 지우면 Let's Encrypt 의 발급 한도에 걸린다.
      - caddy-data:/data
      - caddy-config:/config

  # ── 관리 도구 ────────────────────────────────────────────────────────────
  #
  #   docker compose -f docker-compose.prod.yml --profile admin up -d
  #   docker compose -f docker-compose.prod.yml --profile admin down
  #
  # **내릴 때도 `--profile admin` 을 붙인다.** 빼먹으면 db·server 만 내려가고
  # 관리 화면 둘은 그대로 서 있다(확인함: compose v2.33). 게임을 내려놨으니
  # 다 내려간 줄 알기 쉬운 자리라, 아래 restart: 'no' 가 마지막 그물이다.
  #
  # **관리 화면은 게임 포트처럼 열지 않는다.** 두 서비스 모두 127.0.0.1 에만
  # 묶는다 — 그러면 LAN 의 다른 기계에서도, 포트 포워딩을 해 둔 공유기 밖에서도
  # 보이지 않고, **미니PC 안에서만** 열린다. RDP 로 그 기계에 앉거나 Tailscale
  # 안에서(9장) 본다. 앞의 '3000:3000' 과 달리 주소를 앞에 붙이는 것이 그 뜻이다.
  #
  # 왜 프로필로 빼는가: Adminer 는 로그인만 하면 DB 를 통째로 고칠 수 있는
  # 화면이고 Dozzle 은 도커 소켓을 읽는다. 늘 서 있을 이유가 없는 것을 늘 세워
  # 두면, 그것이 열려 있다는 사실 자체를 잊게 된다. `--profile admin` 을 적는
  # 손이 곧 "지금 관리하러 들어간다"는 선언이다.
  #
  # 왜 restart 를 걸지 않는가(다른 서비스와 다르다): 프로필은 **띄우는 순간**만
  # 정할 뿐이라, unless-stopped 를 걸면 한 번 띄운 관리 화면이 재부팅 뒤에도
  # 혼자 돌아온다. 옵트인이라고 적어 놓고 영구히 사는 서비스가 되는 셈이다.
  # 볼일이 끝나면 사라지는 편이 맞다.
  adminer:
    image: adminer:5
    profiles: ['admin']
    restart: 'no'
    depends_on:
      - db
    environment:
      # 접속 화면의 서버 칸을 미리 채운다. 계정·비밀번호는 .env 의
      # POSTGRES_USER·POSTGRES_PASSWORD 를 손으로 넣는다 — 화면에 미리 박아 두면
      # 그 화면을 여는 것만으로 DB 가 열린다.
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '127.0.0.1:8081:8080'

  # 컨테이너 로그를 브라우저에서 본다. `docker compose logs` 로 되는 일이지만,
  # 여러 서비스를 나란히 놓고 흐르는 것을 보거나 검색할 때는 이쪽이 빠르다.
  dozzle:
    image: amir20/dozzle:v8
    profiles: ['admin']
    restart: 'no'
    volumes:
      # **도커 소켓을 읽는다 — 읽기 전용(:ro)인 것이 중요하다.** 쓰기까지 주면
      # 이 컨테이너가 다른 컨테이너를 만들고 지울 수 있고, 그것은 호스트를
      # 통째로 넘기는 것과 크게 다르지 않다.
      #
      # 앞의 슬래시가 둘인 이유: 윈도(Docker Desktop)에서 Git Bash·MSYS 셸은
      # `/var/...` 로 시작하는 인자를 윈도 경로(`C:/Program Files/Git/var/...`)로
      # 바꿔 버린다. `//` 로 시작하면 그 변환이 일어나지 않고, 리눅스에서는
      # 슬래시가 하나 더 붙은 것뿐이라 같은 경로다 — 양쪽에서 도는 한 줄이다.
      - '//var/run/docker.sock:/var/run/docker.sock:ro'
    ports:
      - '127.0.0.1:8082:8080'

volumes:
  nogada-prod-db:
  caddy-data:
  caddy-config:
