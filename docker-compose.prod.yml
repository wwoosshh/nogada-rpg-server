# 배포용 구성 — 서버 + PostgreSQL. 미니PC 한 대에서 도는 것을 전제한다.
#
#   cp apps/server/.env.example apps/server/.env   # 그리고 비밀번호를 바꾼다
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 개발용 docker-compose.yml 과 **파일이 다르다.** 개발 쪽은 5432 를 호스트에
# 열어 두고 서버는 손으로 띄우지만(테스트가 그 포트를 쓴다), 여기서는 DB 포트를
# 밖으로 내지 않고 서버 컨테이너만 문을 연다 — 열어 둘 이유가 없는 포트를 열지
# 않는 것이 미니PC 를 인터넷에 두는 날의 유일한 방어선이다.
#
# 마이그레이션은 서버 컨테이너의 엔트리포인트가 기동 때마다 돌린다
# (apps/server/docker-entrypoint.sh). 사람이 잊을 수 있는 단계를 남기지 않는다.
#
# 백업: scripts/backup.sh (pg_dump 한 줄). 자세한 절차는 docs/deploy.md.

name: nogada

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # 계정·비밀번호·DB 이름은 서버가 쓰는 .env 와 **같은 파일**에서 온다.
    # 두 파일로 나누면 언젠가 한쪽만 고치고, 그날 서버는 자기 DB 에 못 붙는다.
    env_file:
      - ./apps/server/.env
    # 네임드 볼륨이다. 컨테이너를 지우고 이미지를 새로 구워도 캐릭터는 남는다.
    # 이 볼륨을 지우는 것(`docker compose down -v`)이 곧 진행도 삭제다.
    volumes:
      - nogada-prod-db:/var/lib/postgresql/data
    healthcheck:
      # $$ 는 compose 가 아니라 컨테이너 셸이 풀 변수라는 뜻이다.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  server:
    build:
      # 문맥이 리포지토리 루트인 이유는 pnpm 워크스페이스이기 때문이다 —
      # 서버는 @nogada/shared·@nogada/data 를 소스로 가져다 쓴다.
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/server/.env
    depends_on:
      db:
        # "포트는 열렸는데 아직 초기화 중"인 몇 초에 걸려 넘어지지 않도록
        # 헬스체크가 통과할 때까지 기다린다(설계 규범 9). 이것이 없으면 첫
        # 기동의 마이그레이션이 절반의 확률로 실패한다.
        condition: service_healthy
    # 리버스 프록시(caddy) 뒤에 둘 때는 이 줄을 '127.0.0.1:3000:3000' 으로
    # 바꾼다 — 그러면 3000 은 미니PC 안에서만 보이고 밖에서는 443 만 열린다.
    ports:
      - '3000:3000'

  # 도메인 + 자동 HTTPS 로 공개할 때만 쓴다:
  #
  #   docker compose -f docker-compose.prod.yml --profile caddy up -d
  #
  # 프로필에 넣어 둔 이유는 이것이 선택이기 때문이다 — LAN 이나 Tailscale 로만
  # 노는 동안에는 80/443 을 열 이유가 없다. 반대로 **LAN 밖에 서버를 내놓는다면
  # TLS 없이는 금지다**(설계 규범 8): 평문으로 나가는 것은 비밀번호와 세션
  # 토큰이고, 그것을 공용 와이파이에 흘리는 순간 계정이 남의 것이 된다.
  caddy:
    image: caddy:2-alpine
    profiles: ['caddy']
    restart: unless-stopped
    env_file:
      - ./apps/server/.env
    depends_on:
      - server
    ports:
      - '80:80'
      - '443:443'
    # Caddyfile 없이 한 줄로 세운다. PUBLIC_DOMAIN 이 진짜 도메인이면 Caddy 가
    # 인증서를 알아서 받아 오고 갱신한다(80 이 열려 있어야 한다).
    command: ['sh', '-c', 'caddy reverse-proxy --from "$$PUBLIC_DOMAIN" --to server:3000']
    volumes:
      # 받아 온 인증서가 여기 산다. 이 볼륨을 지우면 재발급을 받게 되고,
      # 하루에 여러 번 지우면 Let's Encrypt 의 발급 한도에 걸린다.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nogada-prod-db:
  caddy-data:
  caddy-config:
