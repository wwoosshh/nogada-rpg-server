<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport 는 그대로 둔다 — 재 보니 고칠 자리가 없었다. `viewport-fit=cover` 가
      노치 뒤까지 그리게 하고(그 안전 영역은 CSS 의 env() 로 되찾는다),
      `user-scalable=no` 가 두 손가락 확대를 막는다. 812x375 고정 화면이라
      확대는 길을 잃는 것 말고 하는 일이 없다.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>노가다 RPG</title>

    <!--
      홈 화면에 추가했을 때 게임처럼 열리게 하는 세 줄. **HTTPS 오리진에서만
      뜻이 있다**(설치는 https 나 localhost 를 하드 요구조건으로 건다 —
      docs/deploy-public.md 1장).

      경로를 `/` 로 시작하는 것이 의도다. 셋 다 `public/` 의 파일이고, vite 가
      빌드에서 `base` 에 맞춰 `./` 로 바꿔 준다(vite.config.ts 가 base 를 `./` 로
      두는 이유는 이 dist 가 웹 루트와 Capacitor 의 https://localhost 두 자리에서
      로드되기 때문이다). 여기 절대 주소를 적으면 그 둘 중 하나가 깨진다.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      주소창·상태바 색. manifest 의 `theme_color` 와 **같은 값이어야 한다** —
      갈라지면 브라우저마다 다른 색이 나온다(설치 전에는 이 meta 를, 설치 뒤에는
      manifest 를 본다). 값은 global.css 가 html/body/#root 에 칠하는
      `--c-ink` 이고, 그래서 상태바가 게임 화면과 이어져 보인다.
      둘이 갈라지는 날은 webManifest.test.ts 가 잡는다.
    -->
    <meta name="theme-color" content="#241c1c" />
    <!--
      사파리는 manifest 의 `icons` 를 안 읽는다 — iOS 홈 화면 아이콘은 이 줄
      하나로만 정해지고, 없으면 화면을 축소한 스크린샷이 아이콘이 된다.
      180x180 을 따로 굽지 않고 192 를 가리키는 이유는 iOS 가 알아서 줄이기
      때문이고, 크기를 하나 더 두면 manifest 가 적은 크기와 갈라질 자리만 는다.
    -->
    <link rel="apple-touch-icon" href="/app-icon/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
