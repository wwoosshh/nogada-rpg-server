# 개발·시험용 PostgreSQL 하나. 서버는 아직 컨테이너에 넣지 않는다 —
# 배포 구성(서버 이미지·리버스 프록시·TLS)은 뒤 태스크의 일이고, 지금 필요한
# 것은 "계약 스위트를 진짜 Postgres 로 한 번 돌린다"는 완료 관문뿐이다.
#
#   docker compose up -d
#   DATABASE_URL=postgres://nogada:nogada@localhost:5432/nogada pnpm --filter @nogada/server migrate up
#   TEST_DATABASE_URL=postgres://nogada:nogada@localhost:5432/nogada pnpm test
#
# 백업은 한 줄이다:
#   docker compose exec -T db pg_dump -U nogada nogada > backup.sql
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nogada
      POSTGRES_PASSWORD: nogada
      POSTGRES_DB: nogada
    ports:
      - '5432:5432'
    # 네임드 볼륨이다. 컨테이너를 지워도 캐릭터는 남는다 — 개발 중에 무심코
    # down 한 번으로 진행도가 사라지지 않아야 한다.
    volumes:
      - nogada-db:/var/lib/postgresql/data
    # 헬스체크가 있어야 "포트는 열렸는데 아직 초기화 중"인 몇 초에 걸려 넘어지지
    # 않는다. 서버를 컨테이너에 넣는 날 depends_on: service_healthy 가 이것을 본다.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nogada -d nogada']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  nogada-db:
