# main 에 들어온 것을 검증하고, 통과한 것만 미니PC 에 올린다.
#
# 두 일이 한 파일에 있는 이유는 **순서가 곧 안전장치**이기 때문이다. 배포는
# `needs: verify` 로 검증 뒤에 서고, 그래서 "테스트는 빨간데 서버는 새 코드로
# 돌고 있다"는 상태가 만들어지지 않는다. 파일을 둘로 나누면 그 순서를 사람이
# 지켜야 하고, 사람은 급할 때 그것을 지키지 않는다.
#
# 미니PC 는 NAT 뒤에 있어 GitHub 이 찾아올 수 없다. 그래서 **미니PC 가 GitHub 에
# 붙는다** — self-hosted 러너가 이쪽에서 나가는 연결로 일감을 받아 온다.
# 공유기에 구멍을 내지 않는 것이 요점이다(docs/deploy.md 9장의 Tailscale 과 같은
# 이유). 러너를 미니PC 에 까는 절차는 docs/deploy.md 13장에 있다.
name: 검증과 배포

on:
  push:
    branches: [main]
  # PR 은 검증만 받는다. 배포 잡이 `github.event_name == 'push'` 로 스스로 빠진다.
  pull_request:

# 이 워크플로가 저장소에 쓸 일은 없다. 토큰의 권한은 필요한 만큼만 준다.
permissions:
  contents: read

jobs:
  verify:
    name: 검증
    runs-on: ubuntu-latest
    # 넉넉하지만 무한은 아니다. 여기서 20분이 넘었다면 뭔가 매달린 것이지
    # 느린 것이 아니다.
    timeout-minutes: 20

    # **진짜 Postgres 를 붙인다.** 계약 스위트(persistence.test.ts)는
    # `TEST_DATABASE_URL` 이 없으면 통째로 건너뛰도록 쓰여 있고, 지금까지는
    # 사람이 손으로 docker 를 띄운 날에만 돌았다 — 건너뛴 것을 통과로 세지
    # 않으려면 CI 가 그 DB 를 늘 대 주어야 한다.
    #
    # 이미지가 배포와 같은 postgres:17-alpine 인 것도 일부러다. 판이 다르면
    # 정렬 규칙(collation)이나 기본 인코딩이 갈릴 수 있고, 그런 차이는 CI 가
    # 초록인 채로 미니PC 에서만 터진다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nogada
          POSTGRES_PASSWORD: nogada
          POSTGRES_DB: nogada
        ports:
          - 5432:5432
        # 헬스체크가 없으면 "포트는 열렸는데 아직 초기화 중"인 몇 초에 첫 질의가
        # 걸려 넘어진다. 배포 compose 가 depends_on 으로 막는 것과 같은 구멍이다.
        options: >-
          --health-cmd "pg_isready -U nogada -d nogada"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # pnpm 을 먼저 깐다 — setup-node 의 `cache: pnpm` 이 pnpm 에게 스토어
      # 위치를 물어보기 때문에, 순서가 뒤집히면 캐시 단계에서 죽는다.
      # 판을 박아 두는 이유는 Dockerfile 과 같다: 잠금 파일을 만든 것과 다른
      # pnpm 이 그 파일을 다시 해석하면 서로 다른 의존성이 깔릴 수 있다.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          # package.json 의 engines 는 >=20.10 이지만 서버 이미지는 22 로 돈다.
          # 검증은 배포와 같은 판에서 도는 편이 낫다.
          node-version: 22
          cache: pnpm

      # --frozen-lockfile 이라 잠금 파일이 package.json 과 어긋나면 여기서 선다.
      # 그것이 목적이다 — 손으로 의존성을 고치고 잠금 파일을 안 올린 커밋은
      # 개발 PC 에서만 돌아간다.
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 데이터를 먼저 굽는다. CSV·TMX 에서 gamedata.json 과 맵 JSON 이 나오고,
      # 그것이 없으면 테스트도 클라이언트 빌드도 시작조차 못 한다.
      # (`pnpm test` 안에도 들어 있지만 따로 두면 실패 지점이 눈에 보인다.)
      - name: 게임 데이터 굽기
        run: pnpm data:build

      - name: 테스트
        # 이 한 줄이 계약 스위트의 건너뛰기를 푼다. 서비스 컨테이너가 호스트의
        # 5432 로 나와 있으므로 러너에서는 localhost 다.
        env:
          TEST_DATABASE_URL: postgres://nogada:nogada@localhost:5432/nogada
        run: pnpm test

      - name: 타입 검사
        run: pnpm typecheck

      # 클라이언트가 실제로 묶이는지 본다. 타입 검사만으로는 vite 설정이나
      # 맵 복사 단계(vite.config.ts 의 closeBundle)가 깨진 것을 못 잡는다.
      # 라이선스 에셋은 저장소에 없지만 빌드는 그것 없이도 선다 — public/ 의
      # 빠진 폴더는 그냥 안 실릴 뿐이다.
      - name: 클라이언트 빌드
        run: pnpm --filter @nogada/client build
  deploy:
    name: 미니PC 배포
    needs: verify
    # PR 에서는 돌지 않는다. push 트리거가 main 에만 걸려 있지만, 나중에 누가
    # 태그나 다른 가지를 트리거에 더하는 날을 위해 가지도 함께 확인한다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 이 셋을 모두 가진 러너에게만 간다.
    runs-on: [self-hosted, windows, mini-pc]
    environment: production
    timeout-minutes: 30

    # **배포는 줄을 서지, 겹치지 않는다.** 두 배포가 같은 폴더에서 동시에
    # `git reset --hard` 와 `pnpm install` 을 하면 어느 코드가 올라갔는지 아무도
    # 모르게 된다. cancel-in-progress 를 켜지 않는 이유는, 취소된 배포가 파일을
    # 반쯤 갈아 치운 상태로 멈출 수 있기 때문이다 — 늦게 끝나는 것이 어중간하게
    # 끝나는 것보다 낫다.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    defaults:
      run:
        # pwsh(PowerShell 7)가 깔려 있지 않은 윈도가 흔하다. 5.1 은 늘 있다.
        shell: powershell

    # **이 job 은 컨테이너를 쓰지 않는다.** 서버 PC 가 윈도 한 대이므로 리눅스
    # 컨테이너를 돌리려고 WSL2 VM 을 얹던 계층을 걷어냈다(실측 회수 2.9GB).
    # 절차와 함정은 docs/deploy-windows.md 에 있다. Dockerfile·compose 는
    # 저장소에 남겨 둔다 — 리눅스 서버로 옮기는 날 되살릴 자산이다.
    #
    # 경로에 슬래시를 쓰는 것은 취향이 아니다: 이 파일을 고치는 도구들을 거치며
    # 백슬래시가 이스케이프로 해석돼 경로가 조용히 깨진 적이 있다. PowerShell 은
    # 슬래시 경로를 그대로 받는다.
    steps:
      # 폴더가 없으면 다음 단계들이 "경로를 찾을 수 없다"로만 죽는다. 그 문장은
      # 무엇을 해야 하는지 말해 주지 않으므로 여기서 미리 말한다.
      - name: 배포 폴더·서비스 확인
        run: |
          $repo = 'C:/nogada-server/nogada-rpg-server'
          if (-not (Test-Path -LiteralPath $repo)) {
            Write-Host "::error::배포 폴더가 없다: $repo — docs/deploy-windows.md 대로 먼저 세운다."
            exit 1
          }
          if (-not (Test-Path -LiteralPath "$repo/apps/server/.env")) {
            Write-Host "::error::apps/server/.env 가 없다. 이 파일은 커밋되지 않으므로 배포가 만들어 줄 수 없다."
            exit 1
          }
          if (-not (Get-Service nogada-server -ErrorAction SilentlyContinue)) {
            Write-Host "::error::nogada-server 서비스가 없다 — docs/deploy-windows.md 의 WinSW 등록을 먼저 끝낸다."
            exit 1
          }

      # **pull 이 아니라 reset 이다.** 미니PC 에서 무언가 손으로 고쳐 본 흔적이
      # 남아 있으면 pull 은 충돌로 서고, 그러면 배포가 사람을 기다린다.
      #
      # `git clean` 은 **하지 않는다.** 추적되지 않는 파일 중에 apps/server/.env
      # 가 있고 그것을 지우면 DB 비밀번호를 지우는 것이며, node_modules 도 여기
      # 있어 지우면 배포마다 전체 재설치가 된다.
      - name: 최신 main 으로 맞추기
        working-directory: C:/nogada-server/nogada-rpg-server
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git --no-pager log -1 --format='배포할 커밋: %h %s'

      # 서버와 그것이 기대는 워크스페이스 패키지만 깐다(`...` 이 의존 패키지를
      # 함께 고른다). devDependencies 를 남기는 이유는 tsx 가 거기 있기 때문이다 —
      # 실행기다. 변경이 없으면 pnpm 이 몇 초에 끝낸다.
      - name: 의존성 설치
        working-directory: C:/nogada-server/nogada-rpg-server
        run: |
          pnpm install --frozen-lockfile --filter "@nogada/server..."
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # CSV·TMX·대사에서 gamedata.json 과 맵 JSON 이 나온다. 이것이 없으면 서버는
      # 부팅 중에 죽는다 — 컨테이너 시절에는 이미지 빌드가 하던 일이다.
      - name: 데이터 굽기
        working-directory: C:/nogada-server/nogada-rpg-server
        run: |
          pnpm data:build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # **스키마부터, 그리고 서비스를 건드리기 전에.** 여기서 실패하면 옛 서버가
      # 그대로 돈다 — 스키마가 어긋난 채 뜬 서버는 요청을 받아 자료를 반쯤 쓰지만,
      # 안 바뀐 서버는 고칠 수 있다(컨테이너 진입점이 지키던 규범 9).
      #
      # DATABASE_URL 은 .env 에 있고 node-pg-migrate 는 환경변수를 읽으므로,
      # 그 한 줄만 뽑아 이 단계에만 실어 준다.
      - name: 마이그레이션
        working-directory: C:/nogada-server/nogada-rpg-server
        run: |
          $line = (Select-String -Path 'apps/server/.env' -Pattern '^DATABASE_URL=' | Select-Object -First 1).Line
          if (-not $line) {
            Write-Host "::error::.env 에 DATABASE_URL 이 없다."
            exit 1
          }
          $env:DATABASE_URL = ($line -split '=', 2)[1].Trim()
          pnpm --filter @nogada/server migrate up
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 배포된 서버가 자기 커밋을 말할 수 있어야 원격에서 배포를 검증한다.
      # 컨테이너 시절에는 이미지에 새겼고(ARG), 지금은 서비스 정의(WinSW XML)의
      # env 를 배포마다 갈아 끼운다 — WinSW 는 시작할 때 XML 을 읽으므로 restart
      # 하나면 반영된다.
      #
      # **서비스 제어에는 권한이 필요하다.** 러너 계정이 그것을 못 가지면 여기서
      # 거부로 서는데, 그 편이 "배포는 초록인데 옛 코드가 돈다"보다 낫다.
      # **문자열 치환이 아니라 XML 로 고친다.** 정규식이었을 때는 표기 하나에만
      # 맞았다 — `value="x"/>` 는 물고 `value="x" />` 나 `></env>` 는 놓쳤는데,
      # 하필 앞의 것이 WinSW 문서의 예시 표기다. 빗나가면 파일을 원문 그대로 다시
      # 쓰고 재시작해, 90초 뒤 "health 가 sha 를 안 준다"로 — 원인과 전혀 다른
      # 곳을 가리키며 — 실패한다. 파서는 표기를 안 가리고, 덤으로 XML 이 깨져
      # 있으면 서비스를 건드리기 전에 여기서 잡는다.
      - name: 서비스 재시작
        working-directory: C:/nogada-server/nogada-rpg-server
        run: |
          $sha = git rev-parse HEAD
          # 이 기계에서 실제로 겪었다: 다른 계정 소유의 저장소라 git 이 조용히
          # 실패하면 $sha 가 비고, 그대로 두면 서비스 정의에 빈 값이 박힌다.
          if ($sha -notmatch '^[0-9a-f]{40}$') {
            Write-Host "::error::git rev-parse 가 커밋을 못 냈다(받은 값: '$sha'). docs/deploy-windows.md 6장의 safe.directory 항목을 본다."
            exit 1
          }
          $xmlPath = 'C:/nogada-server/nogada-server.xml'
          $xml = New-Object System.Xml.XmlDocument
          $xml.PreserveWhitespace = $true
          $xml.Load($xmlPath)
          $node = $xml.SelectSingleNode('/service/env[@name="GIT_SHA"]')
          if (-not $node) {
            Write-Host "::error::$xmlPath 에 GIT_SHA env 원소가 없다 — docs/deploy-windows.md 4장의 XML 과 맞춘다."
            exit 1
          }
          $node.SetAttribute('value', $sha)
          $xml.Save($xmlPath)
          & 'C:/nogada-server/nogada-server.exe' restart
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::서비스 재시작 실패 — 러너 계정에 서비스 제어 권한이 있는지 본다(docs/deploy-windows.md)."
            exit 1
          }

      # **뜬 것과 도는 것은 다르다.** 여기서 sha 까지 대조하는 것이 컨테이너
      # 시절과 다른 점이다: 네이티브에서는 재시작이 조용히 실패해도 **옛 프로세스가
      # 계속 3000 을 쥔 채** health 가 ok 를 준다. 커밋이 일치해야 이 배포가 실제로
      # 올라간 것이다.
      - name: 건강·커밋 확인
        working-directory: C:/nogada-server/nogada-rpg-server
        run: |
          $sha = git rev-parse HEAD
          # 포트의 주인은 .env 다(문서 3장). 여기에 3000 을 박아 두면 .env 를
          # 고친 날 배포만 조용히 엉뚱한 포트를 두드린다.
          $portLine = (Select-String -Path 'apps/server/.env' -Pattern '^PORT=' | Select-Object -First 1).Line
          $port = if ($portLine) { ($portLine -split '=', 2)[1].Trim() } else { '3000' }
          $deadline = (Get-Date).AddSeconds(90)
          $ok = $false
          $last = '아직 한 번도 응답이 없다'
          while ((Get-Date) -lt $deadline) {
            try {
              $res = Invoke-RestMethod -Uri "http://localhost:$port/api/health" -TimeoutSec 5
              if ($res.ok -eq $true -and $res.sha -eq $sha) {
                $ok = $true
                Write-Host "건강함: items=$($res.items) nodes=$($res.nodes) recipes=$($res.recipes) sha=$($res.sha)"
                break
              }
              $last = ($res | ConvertTo-Json -Compress)
            } catch {
              $last = $_.Exception.Message
            }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) {
            Write-Host "::error::90초 안에 ok:true 와 sha=$sha 를 함께 주지 않았다. 마지막 응답: $last"
            exit 1
          }

      # 마무리 증거. 실패한 배포에서 더 필요한 그림이라 always() 로 둔다.
      #
      # **여기서는 아무것도 던지면 안 된다.** GitHub 이 powershell 셸에
      # `$ErrorActionPreference='stop'` 을 앞세우므로, 없는 서비스를 그냥
      # `Get-Service` 하면 이 단계까지 빨개지고 로그 꼬리가 안 찍힌다 — 하필
      # 그 그림이 가장 필요한, 1단계가 "서비스가 없다"로 죽은 상황에서.
      - name: 서비스 상태·로그 꼬리
        if: always()
        run: |
          $svc = Get-Service nogada-server -ErrorAction SilentlyContinue
          if ($svc) { $svc | Format-Table -AutoSize Name, Status, StartType }
          else { Write-Host 'nogada-server 서비스가 없다.' }
          foreach ($name in 'nogada-server.out.log', 'nogada-server.err.log') {
            $log = "C:/nogada-server/logs/$name"
            Write-Host "--- $name ---"
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 40 }
            else { Write-Host '(파일 없음)' }
          }
